# Enable the serial driver in asynchronous mode for Async UART API.
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# Enable logging API, disable printk().
CONFIG_LOG=y
CONFIG_LOG_PRINTK=n

# It is very important for this experiment that we separate logs from actual UART application data.
# UART cannot be used for logging here as it will be used exclusively for data transfer and is the subject of this experiment.

# Use RTT for logging/debugging/monitoring.
CONFIG_LOG_BACKEND_RTT=y

# Disable logging using UART.
# Our program will use it for data transfer only.
CONFIG_LOG_BACKEND_UART=n
